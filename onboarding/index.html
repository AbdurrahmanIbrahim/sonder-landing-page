<style>

/* Layout: Plum Black stage with the Sonder ring as backdrop, one white card per step. Single dark world by design. */
:root{
  color-scheme:dark;
  --canvas:#0A0613; --deep:#1A0F2E; --mid:#2D1A48; --glow:#4A2F6E;
  --mint:#7FFFD4; --mint-deep:#0E8F68; --mint-tint:#ECFBF5; --mint-line:#A9EAD3; --mint-ink:#0B3D2E;
  --violet:#B794F4; --paper:#F5F5F7; --quiet:#8B8FA3;
  --card:#FFFFFF; --ink:#140B22; --ink-2:#4A4458; --ink-3:#857F93; --hair:#E8E5EE; --hover:#F6F4FA;
  --warn-tint:#FFF7EA; --warn-line:#F0D49E; --warn-ink:#6E4500;
  --f-display:'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.card :focus-visible{outline-color:var(--ink)}

/* reviewer bar */


/* stage */
.stage{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:0 40px;min-height:100dvh}
.ring{position:absolute;left:50%;top:30px;width:min(780px,140vw);transform:translateX(-50%);pointer-events:none;z-index:0}
.top{position:relative;z-index:1;width:100%;max-width:640px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-top:16px}
.back{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--paper);display:grid;place-items:center}
.back:hover{background:rgba(255,255,255,.07)}
.back.off{visibility:hidden}
.back svg{width:22px;height:22px}
.wm{justify-self:center;font-family:var(--f-display);font-weight:900;font-size:25px;letter-spacing:-.045em;color:var(--paper);display:inline-flex;align-items:baseline;gap:3px}
.wm svg{width:7px;height:9px}
.bars{position:relative;z-index:1;width:100%;max-width:640px;margin-top:14px;display:grid;gap:8px}
.bars .row{display:grid;gap:6px}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.13);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:3px;transition:width .45s ease}
.chap{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--quiet)}
.chap b{color:var(--paper);font-weight:600}

.cardwrap{position:relative;z-index:1;width:100%;max-width:470px;margin-top:auto;padding-top:56px}
.card{background:var(--card);color:var(--ink);color-scheme:light;border-radius:28px;padding:30px 24px 24px;box-shadow:0 40px 90px -40px rgba(74,47,110,.9);display:flex;flex-direction:column;gap:18px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h1{font-family:var(--f-display);font-weight:800;font-size:clamp(25px,6.4vw,31px);line-height:1.13;letter-spacing:-.02em;margin:0;text-wrap:balance}
.card h2{font-size:12px;font-family:var(--f-mono);font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0}
.sub{margin:-6px 0 0;color:var(--ink-2);font-size:15.5px;text-wrap:pretty}
.eyebrow{margin:0 0 -8px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mint-deep)}

/* options */
.opts{display:flex;flex-direction:column;gap:2px;margin-inline:-12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border:0;background:none;border-radius:14px;text-align:left;color:var(--ink)}
.opt:hover{background:var(--hover)}
.opt .ot{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.opt .ol{font-weight:600;font-size:16.5px;line-height:1.3}
.opt .od{color:var(--ink-3);font-size:13.5px;line-height:1.4}
.opt .badge{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--mint-ink);background:var(--mint-tint);border:1px solid var(--mint-line);padding:1px 7px;border-radius:999px;vertical-align:2px}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #C9C4D3;flex:none;display:grid;place-items:center;transition:border-color .15s,background .15s}
.opt.on .radio{border-color:var(--ink);background:var(--ink)}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--card)}
.radio.sq{border-radius:7px}
.opt.on .radio.sq::after{width:10px;height:5px;border-radius:0;background:none;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.ico{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--mint-tint);color:var(--mint-deep)}
.ico svg{width:23px;height:23px}

/* buttons */
.cta{width:100%;min-height:60px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 24px;transition:background .15s,transform .1s}
.cta:hover{background:#26183A}
.cta:active{transform:scale(.99)}
.cta svg{width:20px;height:20px;fill:none;stroke:var(--mint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cta:disabled{background:#EEECF2;color:#A7A2B3;cursor:not-allowed;transform:none}
.cta:disabled svg{stroke:#A7A2B3}
.ghost{background:none;border:0;color:var(--ink-2);font-size:14px;padding:6px 8px;align-self:center;text-decoration:underline;text-underline-offset:3px}
.skip{background:none;border:0;color:#BDB8C7;font-size:13.5px;padding:4px 8px;align-self:center;margin-top:-6px}
.skip:hover{color:var(--ink-3)}
.sim{background:none;border:1px dashed #CFC9DA;color:var(--ink-3);font-size:12.5px;border-radius:999px;padding:5px 12px;font-family:var(--f-mono)}
.sim:hover{border-color:var(--ink-3);color:var(--ink-2)}

/* message boxes */
.note,.warn{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.note{background:var(--mint-tint);border:1px solid var(--mint-line);color:var(--mint-ink)}
.warn{background:var(--warn-tint);border:1px solid var(--warn-line);color:var(--warn-ink)}
.warn b,.note b{font-weight:600}
.fine{font-size:12.5px;color:var(--ink-3);margin:0;text-align:center;text-wrap:pretty}

/* fields */
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;height:54px;border:1.5px solid var(--hair);border-radius:14px;padding:0 16px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
.input:focus{border-color:var(--ink);outline:none}
.fields{display:flex;flex-direction:column;gap:14px}

/* phone mock */
.demo{display:flex;gap:18px;align-items:center}
.demo .dt{min-width:0;display:flex;flex-direction:column;gap:8px}
.demo .dt b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.demo .dt .len{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.demo ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.demo li{display:flex;gap:8px;font-size:13.5px;color:var(--ink-2);line-height:1.35}
.demo li svg{flex:none;width:16px;height:16px;margin-top:1px;stroke:var(--mint-deep)}
.phone{width:150px;flex:none;aspect-ratio:9/16;border-radius:22px;background:#0d0d10;padding:5px;box-shadow:0 18px 40px -18px rgba(20,11,34,.6)}
.screen{position:relative;height:100%;border-radius:17px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.screen .dots{position:absolute;top:8px;left:10px;right:10px;display:flex;gap:3px}
.screen .dots i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.35)}
.screen .dots i.on{background:#fff}
.capbox{position:relative;background:#fff;color:#111;font-weight:700;font-size:10.5px;line-height:1.3;padding:7px 8px;border-radius:6px;text-align:center}
.s-fic{background:linear-gradient(175deg,#1f2c47 0%,#3b5172 38%,#9b8a7d 72%,#c79b6e 100%)}
.s-fic .lh{position:absolute;left:58%;bottom:34%;width:14px;height:58px;background:linear-gradient(#e9e3da,#cfc6b8);border-radius:3px 3px 0 0}
.s-fic .lh::before{content:"";position:absolute;left:-3px;top:-10px;width:20px;height:10px;background:#f6d38a;border-radius:3px;box-shadow:0 0 22px 8px rgba(246,211,138,.45)}
.s-fic .sea{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#41566f,#202d40)}
.s-non{background:radial-gradient(circle at 50% 30%,#3a2a52,#0d0816 75%);justify-content:center;align-items:center;text-align:center}
.s-non .big{font-family:var(--f-display);font-weight:900;font-size:15px;line-height:1.15;color:#fff;letter-spacing:-.01em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.s-non .big em{font-style:normal;color:var(--mint)}
.s-non .face{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:50% 50% 0 0;background:linear-gradient(#5c4878,#2a1d3e)}
.s-act{background:#F3EFE6;padding:8px}
.s-act .pages{position:absolute;inset:16px 8px 54px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.s-act .pg{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12);display:grid;place-items:center}
.s-act .pg svg{width:70%;height:70%;fill:none;stroke:#2a2a2a;stroke-width:1.4}
.s-act .capbox{background:#140B22;color:#fff}

/* summary chips and lists */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:500;color:var(--ink-2);background:var(--hover);border:1px solid var(--hair);padding:4px 10px;border-radius:999px}
.week{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.week li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--hair)}
.week li:first-child{border-top:0}
.week .d{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.week .t{font-weight:600;font-size:15px;line-height:1.3}
.week .r{display:block;font-weight:400;color:var(--ink-3);font-size:13px}
.week li.locked{background:#FAF9FC}
.week li.locked .t{color:var(--ink-2)}
.need{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.need li{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--ink-2)}
.need li span{width:24px;height:24px;border-radius:50%;background:var(--mint-tint);color:var(--mint-deep);display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-size:12px;font-weight:500}
.sect{display:flex;flex-direction:column;gap:10px}

/* pricing */
.offer{background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.offer .o-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.offer .o-l{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mint)}
.offer .cd{font-family:var(--f-mono);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.offer p{margin:0;font-size:14px;color:#D9D4E3;line-height:1.5}
.offer p b{color:#fff;font-weight:600}
.launchline{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);margin:-4px 0 0}
.launchline strong{color:var(--ink)}
.plans{display:flex;flex-direction:column;gap:8px}
.plan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--hair);border-radius:16px;padding:14px 16px;color:var(--ink)}
.plan:hover{border-color:#CFC9DA}
.plan.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.plan .pl-l{flex:1;min-width:0}
.plan .pl-n{font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan .pl-n em{font-style:normal;font-size:11px;font-weight:600;color:var(--mint-ink);background:var(--mint-tint);border:1px solid var(--mint-line);padding:1px 7px;border-radius:999px}
.plan .pl-d{font-size:13px;color:var(--ink-3)}
.plan .pl-r{text-align:right;flex:none}
.plan .pl-p{display:block;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.plan .pl-s{font-size:12px;color:var(--ink-3)}
.terms{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.terms li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--hair);font-size:14px}
.terms b{font-weight:600}
.terms span{color:var(--ink-2)}

/* checkout mock */
.stripe{border:1.5px dashed #CFC9DA;border-radius:16px;padding:20px;text-align:center;color:var(--ink-3);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* uploads */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border:1.5px dashed #CFC9DA;border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;min-height:132px;justify-content:center}
.tile:hover{border-color:var(--ink-3);background:#FCFBFE}
.tile.done{border-style:solid;border-color:var(--mint-deep);background:var(--mint-tint)}
.tile svg{width:26px;height:26px;fill:none;stroke:var(--ink-2);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile.done svg{stroke:var(--mint-deep)}
.tile .tt{font-weight:600;font-size:14.5px}
.tile .ts{font-size:12px;color:var(--ink-3);word-break:break-word}
.tile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tile-sub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--hair)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font-weight:600;font-size:14.5px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

/* reading strip, b-roll */
.reading{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--hover)}
.reading .rt{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.reading .rt b{font-weight:600;color:var(--ink)}
.reading .rb{height:4px;border-radius:4px;background:#E4E0EB;overflow:hidden}
.reading .rb i{display:block;height:100%;background:var(--mint-deep);border-radius:4px;transition:width .25s linear}
.choice{display:flex;flex-direction:column;gap:8px}
.choice .plan{align-items:flex-start}
.choice .plan .radio{margin-top:2px}
.qr{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--hair)}
.qr canvas{width:104px;height:104px;flex:none;border-radius:8px;background:#fff}
.qr .qt{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2);min-width:0}
.qr .qt b{color:var(--ink)}
.got{display:flex;align-items:center;gap:8px;color:var(--mint-deep);font-weight:600;font-size:14px}
.got svg{width:18px;height:18px;stroke:var(--mint-deep)}

/* reveal */
.found{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:18px;overflow:hidden}
.found > div{padding:14px 16px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.found > div:first-child{border-top:0}
.found .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:8px}
.found .k button{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:13px}
.found .v{font-weight:600;font-size:16px}
.aud{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:4px 10px;align-items:center;font-size:14px}
.aud .ab{grid-column:1/-1;height:5px;border-radius:5px;background:#EEEBF3;overflow:hidden;margin-bottom:6px}
.aud .ab i{display:block;height:100%;background:var(--ink);border-radius:5px}
.aud .ap{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.items{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--ink-2)}
.lockline{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2)}
.lockline svg{width:18px;height:18px;flex:none;stroke:var(--ink);margin-top:1px}
.hook{margin:0;font-size:15px;line-height:1.45;color:var(--ink);padding-left:12px;border-left:2px solid var(--mint-deep)}
.pagegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pagegrid div{aspect-ratio:3/4;border-radius:4px;background:#fff;border:1px solid var(--hair);display:grid;place-items:center}
.pagegrid svg{width:70%;height:70%;fill:none;stroke:#333;stroke-width:1.3}
select.input{appearance:auto;height:48px;font-size:15px}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* connect */
.accts{display:flex;flex-direction:column;gap:8px}
.acct{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--hair);border-radius:16px}
.acct.on{border-color:var(--mint-deep);background:var(--mint-tint)}
.acct .an{flex:1;min-width:0;display:flex;flex-direction:column}
.acct .an b{font-weight:600;font-size:15.5px}
.acct .an span{font-size:12.5px;color:var(--ink-3)}
.pg-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;font-size:16px}
.connectbtn{border:0;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;background:var(--ink);color:#fff}
.acct.on .connectbtn{background:none;color:var(--mint-deep);display:flex;align-items:center;gap:6px;padding-inline:8px}
.connectbtn svg{width:16px;height:16px;stroke:currentColor}

/* first video */
.pipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pipe li{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--ink-3)}
.pipe li i{width:20px;height:20px;border-radius:50%;border:1.5px solid #CFC9DA;flex:none;display:grid;place-items:center}
.pipe li.done{color:var(--ink)}
.pipe li.done i{background:var(--mint-deep);border-color:var(--mint-deep)}
.pipe li.done i::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.pipe li.now{color:var(--ink);font-weight:600}

    return '<h1>Where do you post today?</h1><p class="sub">Pick all that apply.</p><div class="opts">' +

      opt({ label:'Nowhere yet', multi:true, on:S.none, attrs:'data-toggle="none"' }) + '</div>' + (fb ? '<div class="note">' + esc(fb) + '</div>' : '') + cta('Continue', !n); },
  sell: function () {
    return '<h1>' + (writing() ? 'Where will readers buy it?' : 'Where can readers buy it?') + '</h1><div class="opts" role="radiogroup">' +
      opt({ label:SELL.amazon, on:S.sell === 'amazon', attrs:'data-pick="sell" data-val="amazon"' }) +
      opt({ label:SELL.wide, desc:'Kobo, Barnes & Noble, Apple Books and others', on:S.sell === 'wide', attrs:'data-pick="sell" data-val="wide"' }) +
      opt({ label:SELL.own, on:S.sell === 'own', attrs:'data-pick="sell" data-val="own"' }) + '</div>' +
      (S.sell ? '<div class="note">Your videos will end: “' + esc(endLine()) + '”</div>' : '') + cta('Continue', !S.sell); },
  books: function () {
    return '<h1>How many books do you want to promote?</h1><p class="sub">You can add more later.</p><div class="opts" role="radiogroup">' +
      opt({ label:'Just this one', on:S.books === 1, attrs:'data-pick="books" data-val="1" data-auto' }) +
      opt({ label:'Two books', on:S.books === 2, attrs:'data-pick="books" data-val="2" data-auto' }) +
      opt({ label:'Three or more', on:S.books === 3, attrs:'data-pick="books" data-val="3" data-auto' }) + '</div>' +
      '<p class="fine">Publishing for a list of authors? <a href="/publishers">See Sonder for publishers</a></p>'; },
  proof: function () {
    return '<p class="eyebrow">Built by authors</p><h1>Made by two authors who sell books on social media.</h1><div class="founders">' +
      '<div class="founder"><span class="fn">Mike, co-founder</span><span class="fv">107,677</span><span class="fd">books sold across 56 titles</span></div>' +
      '<div class="founder"><span class="fn">Lexi, co-founder</span><span class="fv">$230k</span><span class="fd">of books in one month, with under 1,500 followers</span></div></div>' +
      '<p class="sub" style="margin:0">What we learned: the authors who win are the ones who post a lot and keep going. Sonder is built to make that easy.</p>' +
      '<p class="fine">Founders’ own results. They are not typical, and yours will vary.</p>' + cta('Build my plan'); },
  building: function () {
    var lines = ['Choosing the right first video for your ' + (genreLabel() || 'book').toLowerCase() + (S.kind === 'kids' ? '' : ' book'),
      writing() ? 'Planning teasers that end on “Coming soon”' : 'Setting how every video ends',
      'Sizing your videos for ' + chanText()];
    return '<p class="eyebrow">One moment</p><h1>Building your plan</h1><div class="build"><div class="bigbar"><i></i></div><ul>' +
      lines.map(function (b) { return '<li>' + I.check + '<span>' + esc(b) + '</span></li>'; }).join('') + '</ul></div>'; },
  account: function () {
    return '<h1>Where should we send your plan?</h1><p class="sub">We’ll save it, so you can come back to it any time.</p><div class="fields">' +
      '<div class="field"><label for="f-name">Your first name</label><input id="f-name" class="input" autocomplete="given-name" maxlength="120" value="' + esc(S.name) + '"></div>' +
      '<div class="field"><label for="f-email">Your email</label><input id="f-email" class="input" type="email" autocomplete="email" maxlength="254" value="' + esc(S.email) + '" placeholder="you@example.com"></div></div>' +
      (err ? '<div class="warn">' + esc(err) + '</div>' : '') +
      cta(busy ? 'Saving your plan…' : 'Show me my plan', busy || !okAccount(), 'submit', 'go') +
      '<p class="fine">By continuing you agree to our <a href="/privacy.html">Privacy Policy</a> and Terms.</p>'; },
  plan: function () { var q = S.quiz || {}; var three = q.firstThree || [];
    var chips = [KINDS[S.kind].label, genreLabel(), S.launch === 'soon' ? 'Launches ' + fmtDay(S.launchDate) : S.launch === 'writing' ? 'Still being written' : 'Out now'];
    return '<p class="eyebrow">Your plan</p><h1>' + esc(S.name.trim()) + ', here’s your plan</h1><div class="chips">' + chips.filter(Boolean).map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join('') + '</div>' +
      '<div class="sect"><h2>Your first three videos</h2><ol class="core">' + three.map(function (s, i) {
        var why = s.type === 'amazon_ad' ? (writing() ? 'Once your book is on Amazon' : 'Made for shoppers already on Amazon, ready to buy')
          : s.type === 'slideshow' ? (writing() ? 'A teaser for your story, before it’s out' : 'Your book told slide by slide')
          : (q.route === 'novel' ? 'One scene from your book, told as if it really happened' : q.route === 'memoir' ? 'A true story from your book, told as a story, not a lesson' : q.route === 'how_to' ? 'Your most surprising idea, taught in 90 seconds' : 'Why your book is the one to buy');
        return '<li class="' + (s.paidOnly ? 'paid' : '') + '"><span class="n">' + (i + 1) + '</span><span><span class="ct">' + esc(TYPE_LABEL[s.type]) +
          (s.style ? '<em>' + esc(STYLE_LABEL[s.style] || s.style) + '</em>' : '') + (s.gift ? '<em class="gift">Gift video</em>' : '') + (s.paidOnly ? '<em class="lock">When your plan starts</em>' : '') +
          '</span><span class="cw">' + esc(why) + '</span></span></li>'; }).join('') + '</ol></div>' +
      '<div class="endline">Every video ends: <b>“' + esc(endLine()) + '”</b></div>' +
      '<div class="sect"><h2>Your free trial</h2><p class="sub" style="margin:0">Seven days and 5 videos. Start with the first two above, then try the other video types and find your favourites.</p></div>' +
      '<div class="note"><b>Post a lot, and keep going.</b> Views usually build in weeks 3 to 5, and sales follow. The authors who win are the ones who stay consistent.</div>' + cta('See my price'); },
  pricing: function () { var t = tier(); var q = S.quiz || {}; var exp = q.offerExpiresAt ? new Date(q.offerExpiresAt) : null; var live = exp && exp.getTime() > Date.now();
    var et = exp ? new Intl.DateTimeFormat('en-GB', { weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true, timeZone:'America/New_York' }).format(exp) : '';
    var pt = exp ? new Intl.DateTimeFormat('en-GB', { hour:'numeric', minute:'2-digit', hour12:true, timeZone:'America/Los_Angeles' }).format(exp) : '';
    var dl = S.launch === 'soon' ? daysUntil(S.launchDate) : null; var wk = dl !== null ? Math.floor(dl / 7) : 0;
    return '<p class="eyebrow">Your plan is ready</p><h1>' + esc(S.name.trim()) + ', start free today</h1>' +
      (dl !== null ? '<p class="launchline"><span>Your launch is <strong>' + dl + ' day' + (dl === 1 ? '' : 's') + ' away</strong>. ' + (wk >= 1 ? 'Start today and you’ll have ' + (wk === 1 ? 'a week' : wk + ' weeks') + ' of videos posted before launch day.' : 'Start today to have videos posting before launch day.') + '</span></p>' : '') +
      (live ? '<div class="offer"><div class="o-top"><span class="o-l">30% off if you start today</span><span class="cd" id="cd">' + countdown() + '</span></div><p>Start your trial before <b>' + esc(et) + ' ET</b> (' + esc(pt) + ' PT) and your first paid month is <b>$' + t.first + '</b> instead of $' + t.price + '. This price is held for you only. It won’t come back.</p></div>' : '') +
      '<div class="plans" role="radiogroup">' + TIERS.map(function (x) {
        return '<button class="plan ' + (x.id === t.id ? 'on' : '') + '" data-pick="tier" data-val="' + x.id + '" role="radio" aria-checked="' + (x.id === t.id) + '"><span class="pl-l"><span class="pl-n">' + x.name + (x.id === recTier() ? '<em>Best for you</em>' : '') + '</span><span class="pl-d">' + x.books + ' · ' + x.videos + '</span></span>' +
          '<span class="pl-r"><span class="pl-p">$' + (live ? x.first : x.price) + '</span><span class="pl-s">' + (live ? 'first month, then $' + x.price : 'a month') + '</span></span></button>'; }).join('') + '</div>' +
      (t.id === 'starter' ? '<div class="note"><b>Bigger plans mean more posts, and posting a lot is what works.</b> On Starter, get the most from it with 10 shorts a month: mostly slideshows, plus Quick Reaction Hooks and POV videos, and one Viral Script.</div>' : '') +
      '<ul class="terms"><li><b>Today</b><span>$0. Seven days free, with 5 videos.</span></li><li><b>' + fmtDay(addDays(7)) + '</b><span>$' + (live ? t.first : t.price) + (live ? ' for your first month' : ' a month') + ' on ' + t.name + '</span></li><li><b>After that</b><span>$' + t.price + ' a month. Cancel any time in Settings.</span></li></ul>' +
      cta('Start my free trial', false, 'start') +
      '<p class="fine">You add a card to start and nothing is charged today. A temporary $49 hold checks the card is real, then it’s released. We email you before your first payment.</p>'; }
};

function okAccount() { return S.name.trim().length > 0 && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.email.trim()); }
function countdown() { var q = S.quiz || {}; var ms = Math.max(0, (q.offerExpiresAt ? Date.parse(q.offerExpiresAt) : 0) - Date.now()); var s = Math.floor(ms / 1000);
  return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(function (v) { return String(v).padStart(2, '0'); }).join(':'); }

function persist() { store('sonder_onb', { S:S, cur:cur, hist:hist }); }
function render(scroll) {
  var card = document.getElementById('card');
  card.innerHTML = SCREENS[cur]();
  if (card.getAttribute('data-screen') !== cur) { card.style.animation = 'none'; void card.offsetWidth; card.style.animation = ''; card.setAttribute('data-screen', cur); }
  mount();
  document.getElementById('back').classList.toggle('off', !hist.length || cur === 'building' || cur === 'plan');
  var at = 0, rows = CH.map(function (c, ci) { var i = c[1].indexOf(cur); var w;
    if (i >= 0) { at = ci; w = (i + 1) / c[1].length * 100; } else w = ORDER.indexOf(cur) > ORDER.indexOf(c[1][c[1].length - 1]) ? 100 : 0;
    return '<div class="bar"><i style="width:' + w + '%"></i></div>'; });
  document.getElementById('bars').innerHTML = '<div class="row" style="grid-template-columns:repeat(3,1fr)">' + rows.join('') + '</div><div class="chap"><span><b>' + CH[at][0] + '</b></span><span>Step ' + (at + 1) + ' of 3</span></div>';
  persist();
  if (scroll !== false) window.scrollTo({ top:0 });
}
function mount() {
  var g = document.getElementById('g-other'); if (g) { g.focus(); g.addEventListener('input', function () { S.genreOther = g.value; document.getElementById('go').disabled = !g.value.trim(); persist(); }); }
  var d = document.getElementById('ldate'); if (d) d.addEventListener('change', function () { S.launchDate = d.value || addDays(24); persist(); });
  ['f-name', 'f-email'].forEach(function (id) { var el = document.getElementById(id); if (el) el.addEventListener('input', function () { S[id === 'f-name' ? 'name' : 'email'] = el.value; document.getElementById('go').disabled = busy || !okAccount(); persist(); }); });
  if (cur === 'account' && !S.name) { var n = document.getElementById('f-name'); if (n) n.focus(); }
  if (cur === 'building') setTimeout(function () { if (cur === 'building') next(); }, 3600);
}
function go(id) { if (id !== cur) hist.push(cur); cur = id; err = ''; render(); }
function next() { var i = ORDER.indexOf(cur); if (i < ORDER.length - 1) go(ORDER[i + 1]); }
function back() { if (!hist.length) return; cur = hist.pop(); if (cur === 'building') cur = hist.pop() || 'books'; err = ''; render(); }

function submit() {
  if (busy || !okAccount()) return;
  busy = true; err = ''; render(false);
  var answers = { kind:S.kind, genre:S.genre, genreOther:S.genre === 'other' ? S.genreOther : null, launch:S.launch, launchDate:S.launch === 'soon' ? S.launchDate : null, channels:S.none ? [] : S.channels, sell:S.sell, books:S.books };
  fetch(API + '/api/public/onboarding-quiz', { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ cohort:'quiz', answers:answers, email:S.email.trim(), name:S.name.trim(), utm:carried() }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      busy = false;
      if (!j || !j.ok) { err = j && j.error === 'invalid_email' ? 'Please check your email address.' : 'Something went wrong saving your plan. Please try again.'; render(false); return; }
      S.quiz = j; track('Lead', { content_name:'onboarding_quiz' }); go('plan');
    })
    .catch(function () { busy = false; err = 'We couldn’t reach Sonder. Check your connection and try again.'; render(false); });
}
function start() {
  var t = tier(), q = S.quiz || {};
  if (q.id) { try { fetch(API + '/api/public/onboarding-quiz/' + q.id + '/tier', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ tier:t.id }), keepalive:true }); } catch (e) {} }
  track('InitiateCheckout', { content_name:'onboarding_signup', content_category:t.id });
  var u = new URL(APP + '/signup');
  u.searchParams.set('offer', 'trial');
  u.searchParams.set('email', S.email.trim());
  u.searchParams.set('name', S.name.trim());
  u.searchParams.set('book_ready', writing() ? 'no' : 'yes');
  if (q.id) u.searchParams.set('quiz', q.id);
  var o = carried(); Object.keys(o).forEach(function (k) { u.searchParams.set(k, o[k]); });
  // A short pause so the plan choice reaches us before the page changes.
  setTimeout(function () { location.href = u.toString(); }, 250);
}

document.addEventListener('click', function (e) {
  var p = e.target.closest('[data-pick]');
  if (p && p.closest('#card')) {
    var k = p.getAttribute('data-pick'), v = p.getAttribute('data-val');
    if (k === 'books') v = Number(v);
    if (k === 'kind' && S.kind !== v) S.genre = null;
    S[k] = v; render(false);
    if (p.hasAttribute('data-auto')) { var at = cur; setTimeout(function () { if (cur === at) next(); }, 320); }
    if (k === 'kind' && hist.length === 0) track('ViewContent', { content_name:'onboarding_started' });
    return;
  }
  var t = e.target.closest('[data-toggle]');
  if (t && t.closest('#card')) { var c = t.getAttribute('data-toggle');
    if (c === 'none') { S.none = !S.none; if (S.none) S.channels = []; }
    else { S.none = false; var i = S.channels.indexOf(c); if (i >= 0) S.channels.splice(i, 1); else S.channels.push(c); }
    render(false); return; }
  var a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  var act = a.getAttribute('data-act');
  if (act === 'next') next(); else if (act === 'back') back(); else if (act === 'submit') submit(); else if (act === 'start') start();
});
setInterval(function () { if (cur === 'pricing') { var el = document.getElementById('cd'); if (el) el.textContent = countdown(); } }, 1000);
if ((cur === 'plan' || cur === 'pricing') && !(S.quiz && S.quiz.id)) cur = 'account';
render(false);
})();
</script>
