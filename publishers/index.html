<style>

/* Same visual system as /onboarding: Plum Black stage, Sonder ring backdrop, one white card per step. */
:root{
  color-scheme:dark;
  --canvas:#0A0613; --deep:#1A0F2E; --mid:#2D1A48; --glow:#4A2F6E;
  --mint:#7FFFD4; --mint-deep:#0E8F68; --mint-tint:#ECFBF5; --mint-line:#A9EAD3; --mint-ink:#0B3D2E;
  --violet:#B794F4; --paper:#F5F5F7; --quiet:#8B8FA3;
  --card:#FFFFFF; --ink:#140B22; --ink-2:#4A4458; --ink-3:#857F93; --hair:#E8E5EE; --hover:#F6F4FA;
  --warn-tint:#FFF7EA; --warn-line:#F0D49E; --warn-ink:#6E4500;
  --f-display:'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.card :focus-visible{outline-color:var(--ink)}
.card h1:focus{outline:none}

/* stage */
.stage{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:0 40px;min-height:100dvh}
.ring{position:absolute;left:50%;top:30px;width:min(780px,140vw);transform:translateX(-50%);pointer-events:none;z-index:0}
/* Intro: the tall card would cut through the ring and triangle, so it keeps only the soft halo. */
.stage.intro .ring .rl{display:none}
.top{position:relative;z-index:1;width:100%;max-width:640px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-top:16px}
.back{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--paper);display:grid;place-items:center}
.back:hover{background:rgba(255,255,255,.07)}
.back.off{visibility:hidden}
.back svg{width:22px;height:22px}
.wm{justify-self:center;font-family:var(--f-display);font-weight:900;font-size:25px;letter-spacing:-.045em;color:var(--paper);display:inline-flex;align-items:baseline;gap:3px}
.wm svg{width:7px;height:9px}
.wm small{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--quiet);margin-left:8px;align-self:center}
.bars{position:relative;z-index:1;width:100%;max-width:640px;margin-top:14px;display:grid;gap:8px}
.bars .row{display:grid;gap:6px}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.13);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:3px;transition:width .45s ease}
.chap{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--quiet)}
.chap b{color:var(--paper);font-weight:600}

.cardwrap{position:relative;z-index:1;width:100%;max-width:490px;margin-top:auto;padding-top:56px}
.card{background:var(--card);color:var(--ink);color-scheme:light;border-radius:28px;padding:30px 24px 24px;box-shadow:0 40px 90px -40px rgba(74,47,110,.9);display:flex;flex-direction:column;gap:18px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h1{font-family:var(--f-display);font-weight:800;font-size:clamp(25px,6.4vw,31px);line-height:1.13;letter-spacing:-.02em;margin:0;text-wrap:balance}
.card h2{font-size:12px;font-family:var(--f-mono);font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0}
.sub{margin:-6px 0 0;color:var(--ink-2);font-size:15.5px;text-wrap:pretty}
.eyebrow{margin:0 0 -8px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mint-deep)}

/* options */
.opts{display:flex;flex-direction:column;gap:2px;margin-inline:-12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border:0;background:none;border-radius:14px;text-align:left;color:var(--ink)}
.opt:hover{background:var(--hover)}
.opt .ot{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.opt .ol{font-weight:600;font-size:16.5px;line-height:1.3}
.opt .od{color:var(--ink-3);font-size:13.5px;line-height:1.4}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #C9C4D3;flex:none;display:grid;place-items:center;transition:border-color .15s,background .15s}
.opt.on .radio,.door.on .radio{border-color:var(--ink);background:var(--ink)}
.opt.on .radio::after,.door.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--card)}
.ico{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--mint-tint);color:var(--mint-deep)}
.ico svg{width:23px;height:23px}

/* buttons */
.cta{width:100%;min-height:60px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 24px;transition:background .15s,transform .1s;text-decoration:none}
.cta:hover{background:#26183A}
.cta:active{transform:scale(.99)}
.cta svg{width:20px;height:20px;fill:none;stroke:var(--mint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cta:disabled{background:#EEECF2;color:#A7A2B3;cursor:not-allowed;transform:none}
.cta:disabled svg{stroke:#A7A2B3}
.cta.alt{background:#fff;color:var(--ink);border:1.5px solid var(--hair);min-height:54px;font-size:16px}
.cta.alt:hover{background:var(--hover);border-color:#CFC9DA}
.btns{display:flex;flex-direction:column;gap:10px}

/* message boxes */
.note,.warn{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.note{background:var(--mint-tint);border:1px solid var(--mint-line);color:var(--mint-ink)}
.warn{background:var(--warn-tint);border:1px solid var(--warn-line);color:var(--warn-ink)}
.warn b,.note b{font-weight:600}
.fine{font-size:12.5px;color:var(--ink-3);margin:0;text-align:center;text-wrap:pretty}

/* fields */
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field label span{font-weight:400;color:var(--ink-3)}
.input{width:100%;height:54px;border:1.5px solid var(--hair);border-radius:14px;padding:0 16px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
.input:focus{border-color:var(--ink);outline:none}
.fields{display:flex;flex-direction:column;gap:14px}

/* intro points, trust points */
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.points li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);line-height:1.45}
.points li b{display:block;color:var(--ink);font-weight:600;font-size:15.5px}
.points .ico{width:40px;height:40px}
.points .ico svg{width:20px;height:20px}
.points.tight li{align-items:center}
.points.tight .ico{width:28px;height:28px;background:none}
.points.tight .ico svg{width:20px;height:20px}

/* door cards */
.doors{display:flex;flex-direction:column;gap:10px}
.door{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--hair);border-radius:18px;padding:15px 16px;color:var(--ink)}
.door:hover{border-color:#CFC9DA}
.door.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.door .radio{margin-top:2px}
.door .dl{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.door .dn{font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3}
.door .dn em{font-style:normal;font-size:11px;font-weight:600;color:var(--mint-ink);background:var(--mint-tint);border:1px solid var(--mint-line);padding:1px 8px;border-radius:999px}
.door .dd{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.door .dq{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.door .dq b{font-weight:600;color:var(--mint-deep)}

/* result */
.recap{font-size:14px;font-weight:500;color:var(--ink-2);background:var(--hover);border:1px solid var(--hair);padding:9px 14px;border-radius:999px;align-self:flex-start;max-width:100%}
.sect{display:flex;flex-direction:column;gap:10px}
.core{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.core li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--hair);border-radius:16px}
.core .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:15px}
.core .ct{font-weight:600;font-size:15.5px;line-height:1.3;display:block}
.core .cw{display:block;font-size:13.5px;color:var(--ink-3);margin-top:2px}
.endline{border-radius:14px;background:var(--hover);padding:12px 14px;font-size:14px;color:var(--ink-2)}

.foot{position:relative;z-index:1;margin:18px 0 0;font-size:13.5px;color:var(--quiet);text-align:center;display:flex;flex-direction:column;gap:4px}
.foot a,.fine a{color:inherit;text-decoration:underline;text-underline-offset:3px}

@media(max-width:420px){
  .card{padding:26px 18px 20px;border-radius:24px}
  .wm small{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

</style>

function pickList(key, rows, auto) {
  return '<div class="opts" role="radiogroup">' + rows.map(function (r) {
    return opt({ label:r[1], desc:r[2], on:S[key] === r[0], attrs:'data-pick="' + key + '" data-val="' + r[0] + '"' + (auto ? ' data-auto' : '') });
  }).join('') + '</div>';
}

var SCREENS = {
  intro: function () {
    return '<p class="eyebrow">For publishers</p><h1 tabindex="-1">Video marketing for your whole list.</h1>' +
      '<p class="sub">Sonder turns your titles into short videos for TikTok, Instagram, YouTube Shorts and Amazon ads.</p>' +
      '<ul class="points">' +
        '<li><span class="ico">' + I.feed + '</span><span><b>Bring your titles in your way</b>From your ONIX feed, your files or your Amazon pages.</span></li>' +
        '<li><span class="ico">' + I.tag + '</span><span><b>No manuscripts needed</b>Your metadata is enough to start.</span></li>' +
        '<li><span class="ico">' + I.shield + '</span><span><b>Your books stay yours</b>Never used to train AI.</span></li>' +
      '</ul>' + cta('Get started', false, 'start') +
      '<p class="fine">Six quick questions, then we set up your workspace.</p>'; },
  type: function () {
    return '<h1 tabindex="-1">What best describes you?</h1>' + pickList('publisherType', TYPES, true); },
  catalogue: function () {
    return '<h1 tabindex="-1">How many titles are in your catalogue?</h1><p class="sub">A rough number is fine.</p>' + pickList('catalogueSize', SIZES, true); },
  newTitles: function () {
    return '<h1 tabindex="-1">How many new titles do you publish a year?</h1>' + pickList('newTitlesPerYear', NEW_PER_YEAR, true); },
  focus: function () {
    return '<h1 tabindex="-1">Where do you want to start?</h1>' + pickList('focus', FOCUS, true); },
  door: function () { var d = door();
    return '<h1 tabindex="-1">How should Sonder get to know your books?</h1><p class="sub">Pick one to start with.</p><div class="doors" role="radiogroup">' +
      DOOR_ORDER.map(function (k) { var x = DOORS[k];
        return '<button class="door ' + (d === k ? 'on' : '') + '" data-pick="door" data-val="' + k + '" role="radio" aria-checked="' + (d === k) + '">' +
          '<span class="dl"><span class="dn">' + esc(x.label) + '<em>' + esc(x.badge) + '</em></span><span class="dd">' + esc(x.body) + '</span>' + (x.q ? '<span class="dq">' + x.q + '</span>' : '') + '</span>' +
          '<span class="radio"></span></button>'; }).join('') + '</div>' +
      '<p class="fine">You can mix them: ONIX for the whole list, manuscripts for your lead titles.</p>' + cta('Continue', !d); },
  promoteOn: function () {
    return '<h1 tabindex="-1">Who posts the videos?</h1>' + pickList('promoteOn', PROMOTE, true); },
  trust: function () {
    return '<h1 tabindex="-1">Your books stay yours.</h1><ul class="points">' +
      '<li><span class="ico">' + I.shield + '</span><span><b>Never used to train AI</b>Not your files, not your metadata.</span></li>' +
      '<li><span class="ico">' + I.lock + '</span><span><b>Only used to make your videos</b>Never shared or sold.</span></li>' +
      '<li><span class="ico">' + I.tag + '</span><span><b>No manuscript needed</b>Your metadata is enough to start.</span></li>' +
      '</ul>' + cta('Continue'); },
  details: function () {
    return '<h1 tabindex="-1">Who should we set the workspace up for?</h1><p class="sub">We’ll use these details to create your account.</p><div class="fields">' +
      '<div class="field"><label for="f-name">Your first name</label><input id="f-name" class="input" autocomplete="given-name" maxlength="120" value="' + esc(S.name) + '"></div>' +
      '<div class="field"><label for="f-email">Work email</label><input id="f-email" class="input" type="email" autocomplete="email" maxlength="254" value="' + esc(S.email) + '" placeholder="you@yourpress.com"></div>' +
      '<div class="field"><label for="f-company">Company or imprint</label><input id="f-company" class="input" autocomplete="organization" maxlength="160" value="' + esc(S.company) + '"></div>' +
      '<div class="field"><label for="f-role">Your role <span>(optional)</span></label><input id="f-role" class="input" autocomplete="organization-title" maxlength="120" value="' + esc(S.role) + '" placeholder="Marketing manager, publisher, founder…"></div></div>' +
      (err ? '<div class="warn" role="alert">' + esc(err) + '</div>' : '') +
      cta(busy ? 'Setting up…' : 'Set up my workspace', busy || !okDetails(), 'submit', 'go') +
      '<p class="fine">By continuing you agree to our <a href="/privacy.html">Privacy Policy</a> and <a href="/terms">Terms</a>.</p>'; },
  result: function () { var d = DOORS[door() || 'onix'];
    return '<p class="eyebrow">' + (S.name.trim() ? 'Thanks, ' + esc(S.name.trim()) : 'Your workspace') + '</p><h1 tabindex="-1">Your publisher workspace is ready to set up.</h1>' +
      '<span class="recap">' + esc(recap()) + '</span>' +
      '<div class="sect"><h2>Next steps</h2><ol class="core">' +
        '<li><span class="n">1</span><span><span class="ct">Create your account</span><span class="cw">Use ' + esc(S.email.trim() || 'your work email') + '.</span></span></li>' +
        '<li><span class="n">2</span><span><span class="ct">Bring in your titles by ' + esc(d.by) + '</span><span class="cw">' + esc(d.step) + '</span></span></li>' +
        '<li><span class="n">3</span><span><span class="ct">Pick the books to start with</span><span class="cw">We make their videos, ' + esc(WHO_POSTS[S.promoteOn] || WHO_POSTS.imprint) + '.</span></span></li>' +
      '</ol></div>' +
      '<div class="endline">You start with a 7-day free trial, so you can bring your titles in and see the videos first. Publisher plans are priced by how many videos you make each month, and we’ll recommend one once your titles are in.</div>' +
      '<div class="btns">' + cta('Create my workspace', false, 'signup') +
        (CALL_URL ? '<a class="cta alt" href="' + esc(CALL_URL) + '" target="_blank" rel="noopener">Talk to us first</a>' : '') + '</div>'; }
};

function okEmail() { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.email.trim()); }
function okDetails() { return S.name.trim().length > 0 && okEmail() && S.company.trim().length > 0; }

function persist() { store(KEY, { S:S, cur:cur, hist:hist }); }
function render(scroll, focus) {
  var card = document.getElementById('card');
  card.innerHTML = SCREENS[cur]();
  if (card.getAttribute('data-screen') !== cur) { card.style.animation = 'none'; void card.offsetWidth; card.style.animation = ''; card.setAttribute('data-screen', cur); }
  mount();
  document.getElementById('stage').classList.toggle('intro', cur === 'intro');
  document.getElementById('back').classList.toggle('off', !hist.length || cur === 'intro' || cur === 'result');
  var at = 0, rows = CH.map(function (c, ci) { var i = c[1].indexOf(cur); var w;
    if (i >= 0) { at = ci; w = (i + 1) / c[1].length * 100; } else w = ORDER.indexOf(cur) > ORDER.indexOf(c[1][c[1].length - 1]) ? 100 : 0;
    return '<div class="bar"><i style="width:' + w + '%"></i></div>'; });
  document.getElementById('bars').innerHTML = '<div class="row" style="grid-template-columns:repeat(3,1fr)">' + rows.join('') + '</div><div class="chap"><span><b>' + CH[at][0] + '</b></span><span>Step ' + (at + 1) + ' of 3</span></div>';
  persist();
  if (scroll !== false) window.scrollTo({ top:0 });
  if (focus) { var h = card.querySelector('h1'); if (h && cur !== 'details') try { h.focus({ preventScroll:true }); } catch (e) {} }
}
function mount() {
  [['f-name','name'],['f-email','email'],['f-company','company'],['f-role','role']].forEach(function (p) {
    var el = document.getElementById(p[0]);
    if (el) el.addEventListener('input', function () { S[p[1]] = el.value; var b = document.getElementById('go'); if (b) b.disabled = busy || !okDetails(); persist(); });
  });
  if (cur === 'details' && !busy && !S.name) { var n = document.getElementById('f-name'); if (n) n.focus(); }
}
function go(id) { if (id !== cur) hist.push(cur); cur = id; err = ''; render(true, true); }
function next() { var i = ORDER.indexOf(cur); if (i < ORDER.length - 1) go(ORDER[i + 1]); }
function back() { if (!hist.length) return; cur = hist.pop(); err = ''; render(true, true); }

function body() {
  var b = { name:S.name.trim(), email:S.email.trim(), company:S.company.trim(),
    publisherType:S.publisherType, catalogueSize:S.catalogueSize, newTitlesPerYear:S.newTitlesPerYear,
    focus:S.focus, door:door(), promoteOn:S.promoteOn };
  if (S.role.trim()) b.role = S.role.trim();
  var u = carried(); if (Object.keys(u).length) b.utm = u;
  return b;
}
function post(keepalive) {
  return fetch(API + '/api/public/publisher-onboarding', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body()), keepalive:!!keepalive });
}
function submit() {
  if (busy || !okDetails()) return;
  busy = true; err = ''; render(false);
  var done = false;
  /* If our server is slow or down, the publisher still goes on to sign up. Answers stay saved in this tab. */
  var t = setTimeout(function () { if (!done) { done = true; busy = false; S.id = null; S.signupUrl = null; go('result'); } }, 10000);
  post(false)
    .then(function (r) { return r.json().catch(function () { return null; }).then(function (j) { return { status:r.status, j:j }; }); })
    .then(function (res) {
      if (done) return; done = true; clearTimeout(t); busy = false;
      var j = res.j;
      if (res.status === 400 && j && j.error === 'invalid') {
        err = j.message && String(j.message).length < 200 ? String(j.message) : 'Please check your details and try again.';
        render(false); return;
      }
      if (j && j.success && j.data) { S.id = j.data.id || null; S.signupUrl = j.data.signupUrl || null; trackCustom('PublisherLead', { content_name:'publisher_onboarding', content_category:door() }); }
      else { S.id = null; S.signupUrl = null; }
      go('result');
    })
    .catch(function () { if (done) return; done = true; clearTimeout(t); busy = false; S.id = null; S.signupUrl = null; go('result'); });
}
function signup() {
  var url = signupUrl();
  /* The first save didn't reach us: try once more on the way out, so the account is still recognised as a publisher. */
  if (!S.id) { try { post(true).catch(function () {}); } catch (e) {} setTimeout(function () { location.href = url; }, 250); return; }
  location.href = url;
}

document.addEventListener('click', function (e) {
  var p = e.target.closest('[data-pick]');
  if (p && p.closest('#card')) {
    var k = p.getAttribute('data-pick'), v = p.getAttribute('data-val');
    S[k] = v; if (k === 'door') S.doorPicked = true;
    render(false);
    if (p.hasAttribute('data-auto')) { var at = cur; setTimeout(function () { if (cur === at) next(); }, 320); }
    return;
  }
  var a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  var act = a.getAttribute('data-act');
  if (act === 'next' || act === 'start') next(); else if (act === 'back') back(); else if (act === 'submit') submit(); else if (act === 'signup') signup();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && cur === 'details' && e.target && e.target.classList && e.target.classList.contains('input')) { e.preventDefault(); submit(); }
});
render(false);
})();
</script>

</body>
</html>
